<style>
/* ---------- RESET ---------- */
*{margin:0;padding:0;box-sizing:border-box;}

/* ---------- BASE / THEME ---------- */
:root{
    --bg:#fafafa;
    --bg-card:#ffffff;
    --text:#1a1a1a;
    --text-light:#6b6b6b;
    --text-lighter:#9a9a9a;
    --border:#e8e8e8;
    --border-hover:#c0c0c0;
    --nav-bg:rgba(255,255,255,.92);
    --transition:0.4s cubic-bezier(0.25,0.46,0.45,0.94);
}
[data-theme="dark"]{
    --bg:#141414;
    --bg-card:#1e1e1e;
    --text:#eaeaea;
    --text-light:#a0a0a0;
    --text-lighter:#6a6a6a;
    --border:#2e2e2e;
    --border-hover:#4a4a4a;
    --nav-bg:rgba(20,20,20,.92);
}
html{scroll-behavior:smooth;}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    transition:background var(--transition), color var(--transition);
}
@media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
::selection{background:var(--text);color:var(--bg);}
:focus-visible{outline:2px solid var(--text);outline-offset:3px;}
.skip-link{position:absolute;left:-9999px;top:0;z-index:2000;background:var(--text);color:var(--bg);padding:.75rem 1.25rem;font-size:.85rem;}
.skip-link:focus{left:1rem;top:1rem;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
img{max-width:100%;display:block;}

/* ---------- NAV ---------- */
.nav{
    position:fixed;top:0;left:0;width:100%;
    background:var(--nav-bg);
    border-bottom:1px solid var(--border);
    padding:0 2rem;z-index:1000;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:background var(--transition), border-color var(--transition);
}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;height:72px;}
.nav-left{display:flex;align-items:center;gap:1.2rem;}
.nav-logo{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:1.3rem;letter-spacing:-.02em;text-decoration:none;color:var(--text);cursor:pointer;background:none;border:none;}
.nav-title{font-size:.75rem;color:var(--text-light);font-weight:300;padding-left:1.2rem;border-left:1px solid var(--border);white-space:nowrap;}
@media(max-width:820px){.nav-title{display:none;}}
.nav-links{display:flex;gap:2.5rem;align-items:center;list-style:none;}
.nav-links a{font-size:.75rem;font-weight:400;letter-spacing:.8px;text-transform:uppercase;text-decoration:none;color:var(--text-light);transition:color .3s;position:relative;padding-bottom:2px;cursor:pointer;}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1px;background:var(--text);transition:width .3s;}
.nav-links a:hover{color:var(--text);}
.nav-links a:hover::after,.nav-links a.active::after{width:100%;}
.nav-links a.active{color:var(--text);}
.theme-toggle-nav{background:none;border:none;color:var(--text-light);font-size:1.1rem;cursor:pointer;padding:0;}
.theme-toggle-nav:hover{color:var(--text);}
.nav-toggle{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;}
.nav-toggle span{width:24px;height:1.5px;background:var(--text);transition:all .3s;display:block;}
.nav-toggle.open span:nth-child(1){transform:rotate(45deg) translate(4px,4px);}
.nav-toggle.open span:nth-child(2){opacity:0;}
.nav-toggle.open span:nth-child(3){transform:rotate(-45deg) translate(4px,-4px);}
@media(max-width:820px){
    .nav{padding:0 1.2rem;}
    .nav-links{
        position:fixed;top:72px;left:0;width:100%;
        background:var(--nav-bg);
        border-bottom:1px solid var(--border);
        flex-direction:column;padding:2rem;gap:1.5rem;
        transform:translateY(-120%);transition:transform .3s ease;
        align-items:flex-start;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    }
    .nav-links.open{transform:translateY(0);}
    .nav-toggle{display:flex;}
}

/* ---------- CONTAINER / PAGES ---------- */
.container{max-width:1200px;margin:0 auto;padding:0 2rem;}
.page{display:none;padding-top:100px;min-height:70vh;animation:fadeIn .5s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.page-title{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:2.2rem;letter-spacing:-.01em;margin-bottom:.3rem;}
.page-subtitle{color:var(--text-light);font-weight:300;font-size:.95rem;margin-bottom:2.5rem;}
@media(max-width:520px){.page{padding-top:80px;}.page-title{font-size:1.8rem;}}

/* ---------- HOME / HERO (full-screen looping film) ---------- */
#page-home{padding-top:0;}
.hero{position:relative;height:100svh;width:100%;overflow:hidden;display:flex;align-items:flex-end;}
@media(min-width:640px){.hero{align-items:center;}}
.hero-media{position:absolute;inset:0;background:#0a0a09;}
.hero-media img,.hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero-media video{opacity:0;transition:opacity 1s;}
.hero-media video.visible{opacity:1;}
.hero-scrim{position:absolute;inset:0;background:rgba(10,10,9,.4);}
.hero-content{position:relative;z-index:2;width:100%;padding:0 1.5rem 4rem;color:#f4f3ee;}
@media(min-width:640px){.hero-content{padding:0 2.5rem;}}
.hero-content h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:13vw;line-height:.95;margin:0;}
@media(min-width:640px){.hero-content h1{font-size:6.5vw;}}
@media(min-width:1024px){.hero-content h1{font-size:5.5vw;}}
.hero-content p{margin:1rem 0 0;max-width:28rem;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;opacity:.85;}
@media(min-width:640px){.hero-content p{font-size:1rem;}}
.hero-links{display:flex;gap:2rem;margin-top:2.5rem;}
@media(min-width:640px){.hero-links{margin-top:3.5rem;}}
.hero-links a{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:#f4f3ee;text-decoration:underline;text-decoration-color:rgba(244,243,238,.4);text-underline-offset:8px;transition:text-decoration-color .3s;}
.hero-links a:hover{text-decoration-color:#f4f3ee;}

/* ---------- REEL (kept from base: a quiet showreel loop, now on the Work page, separate from the hero) ---------- */
.reel-video-wrapper{position:relative;width:100%;max-width:1000px;margin:0 auto 3rem;background:#000;border-radius:2px;overflow:hidden;aspect-ratio:16/9;}
.reel-video-wrapper video,.reel-video-wrapper img{width:100%;height:100%;object-fit:cover;display:block;}

/* ---------- WORK GRID ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2rem;margin:2rem 0;}
.grid-item{background:var(--bg-card);border:1px solid var(--border);border-radius:2px;overflow:hidden;cursor:pointer;transition:all var(--transition);}
.grid-item:hover{border-color:var(--border-hover);transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,.04);}
.grid-item .thumb{width:100%;aspect-ratio:3/2;position:relative;overflow:hidden;background:var(--bg);}
.grid-item .thumb img{width:100%;height:100%;object-fit:cover;}
.grid-item .thumb .play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,9,0);transition:background .3s;}
.grid-item:hover .thumb .play-badge{background:rgba(10,10,9,.25);}
.grid-item .thumb .play-badge span{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;}
.grid-item:hover .thumb .play-badge span{opacity:1;}
.grid-item .thumb .play-badge span::after{content:'';margin-left:3px;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #fff;}
.grid-item .caption{padding:1.2rem 1.5rem 1.5rem;border-top:1px solid var(--border);}
.grid-item .caption .project-title{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:1.05rem;margin-bottom:.15rem;}
.grid-item .caption .project-sub{font-size:.8rem;color:var(--text-light);font-weight:300;}
@media(max-width:820px){.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem;}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:1rem;}.grid-item .caption{padding:.8rem 1rem 1rem;}.grid-item .caption .project-title{font-size:.95rem;}}
@media(max-width:400px){.grid{grid-template-columns:1fr;}}

/* ---------- STILLS ---------- */
.stills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem;}
.stills-grid .still-item{background:var(--bg-card);border:1px solid var(--border);border-radius:2px;overflow:hidden;cursor:pointer;transition:all var(--transition);}
.stills-grid .still-item:hover{border-color:var(--border-hover);transform:scale(1.01);}
.stills-grid .still-item .thumb{width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--bg);}
.stills-grid .still-item .thumb img{width:100%;height:100%;object-fit:cover;}
@media(max-width:820px){.stills-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.2rem;}}
@media(max-width:520px){.stills-grid{grid-template-columns:1fr 1fr;gap:1rem;}}

/* ---------- LIGHTBOX ---------- */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:1999;justify-content:center;align-items:center;padding:2rem;}
.lightbox.active{display:flex;}
.lightbox .lightbox-content{max-width:900px;width:100%;text-align:center;animation:fadeIn .4s ease;}
.lightbox .lightbox-media{width:100%;max-height:75vh;background:#000;border-radius:2px;overflow:hidden;margin-bottom:1.2rem;}
.lightbox .lightbox-media img{width:100%;height:100%;object-fit:contain;max-height:75vh;margin:0 auto;}
.lightbox .lightbox-media iframe{width:100%;aspect-ratio:16/9;border:0;display:block;}
.lightbox .lb-title{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:1.6rem;color:#f4f3ee;margin-bottom:.2rem;}
.lightbox .lb-sub{color:#c9c9c4;font-size:.85rem;font-weight:300;}
.lightbox .close-lightbox{position:fixed;top:2rem;right:2rem;color:#fff;font-size:2rem;cursor:pointer;background:none;border:none;transition:transform .3s;font-weight:100;z-index:2000;}
.lightbox .close-lightbox:hover{transform:rotate(90deg);}
@media(max-width:520px){.lightbox .lightbox-content{padding:0;}.lightbox .lb-title{font-size:1.3rem;}}

/* ---------- ABOUT ---------- */
.about-layout{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;}
.about-photo{background:var(--bg-card);border:1px solid var(--border);border-radius:2px;width:100%;aspect-ratio:4/5;overflow:hidden;}
.about-photo img{width:100%;height:100%;object-fit:cover;}
.about-bio p{font-size:1rem;color:var(--text-light);font-weight:300;line-height:1.8;margin-bottom:1rem;}
.about-bio p:first-child{color:var(--text);}
@media(max-width:820px){.about-layout{grid-template-columns:1fr;gap:2rem;}.about-photo{max-width:360px;margin:0 auto;}}

/* ---------- CONTACT (simple — no form, just direct links) ---------- */
.contact-links{display:flex;flex-direction:column;gap:1rem;margin-top:1rem;}
.contact-links a{width:fit-content;font-size:1.3rem;font-family:'Playfair Display',serif;font-style:italic;color:var(--text);text-decoration:none;border-bottom:1px solid var(--border);transition:border-color .3s;}
.contact-links a:hover{border-color:var(--text);}
.contact-socials{display:flex;gap:2rem;margin-top:2.5rem;}
.contact-socials a{color:var(--text-light);text-decoration:none;font-size:.75rem;letter-spacing:.8px;text-transform:uppercase;transition:color .3s;}
.contact-socials a:hover{color:var(--text);}

/* ---------- FOOTER ---------- */
footer{margin-top:4rem;padding:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1.5rem;font-size:.8rem;color:var(--text-light);font-weight:300;transition:border-color var(--transition);max-width:1200px;margin-left:auto;margin-right:auto;}
footer .footer-social{display:flex;gap:1.5rem;}
footer .footer-social a,footer .footer-right a{color:var(--text-light);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:all .3s;}
footer .footer-social a:hover,footer .footer-right a:hover{color:var(--text);border-bottom-color:var(--text);}
footer .footer-center{font-family:'Playfair Display',serif;font-style:italic;color:var(--text);font-size:.85rem;text-align:center;}
footer .footer-right{display:flex;gap:1.5rem;}
@media(max-width:820px){footer{flex-direction:column;text-align:center;}}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>

/* ============================================================
   Site engine — no need to edit below this line for normal use.
   ============================================================ */
(function(){
  "use strict";
  const s = CONTENT.site;
  const esc = (str) => String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Converts a normal Vimeo/YouTube page URL into an embeddable player URL.
  function getEmbedUrl(url){
    try{
      const u = new URL(url);
      if(u.hostname.includes("youtube.com") || u.hostname.includes("youtu.be")){
        const id = u.hostname.includes("youtu.be") ? u.pathname.slice(1) : u.searchParams.get("v");
        if(!id) return null;
        return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
      }
      if(u.hostname.includes("vimeo.com")){
        const id = u.pathname.split("/").filter(Boolean).pop();
        if(!id) return null;
        return `https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0`;
      }
      return null;
    }catch(e){ return null; }
  }

  // ---- Static text fills ----
  document.getElementById("navSubtitle").textContent = s.role;
  document.getElementById("homeName").textContent = s.name;
  document.getElementById("homeTagline").textContent = s.tagline;
  document.title = `${s.name} · ${s.role}`;

  document.getElementById("aboutPhoto").src = s.portrait;
  document.getElementById("aboutPhoto").alt = `Portrait of ${s.name}`;
  document.getElementById("aboutBio").innerHTML = s.bio.map(p => `<p>${esc(p)}</p>`).join("");

  document.getElementById("contactLinks").innerHTML = `
    <a href="mailto:${s.email}">${esc(s.email)}</a>
    <a href="tel:${s.phoneHref}">${esc(s.phone)}</a>
  `;
  document.getElementById("contactSocials").innerHTML = `
    <a href="${s.instagram}" target="_blank" rel="noopener noreferrer">Instagram</a>
    <a href="${s.youtube}" target="_blank" rel="noopener noreferrer">YouTube</a>
  `;

  document.getElementById("footerSocial").innerHTML = `
    <a href="${s.instagram}" target="_blank" rel="noopener noreferrer">Instagram</a>
    <a href="${s.youtube}" target="_blank" rel="noopener noreferrer">YouTube</a>
  `;
  document.getElementById("footerCenter").textContent = `© ${s.name} — ${new Date().getFullYear()}`;
  document.getElementById("footerRight").innerHTML = `
    <a href="mailto:${s.email}">${esc(s.email)}</a>
    <a href="tel:${s.phoneHref}">${esc(s.phone)}</a>
  `;

  // ---- Hero background video (with graceful fallback) ----
  const heroPoster = document.getElementById("heroPoster");
  const heroVideo = document.getElementById("heroVideo");
  heroPoster.src = CONTENT.hero.poster;
  heroVideo.poster = CONTENT.hero.poster;
  heroVideo.innerHTML = `
    <source src="${CONTENT.hero.videoMobile}" media="(max-width: 768px)" type="video/mp4">
    <source src="${CONTENT.hero.videoDesktop}" type="video/mp4">
  `;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!reduceMotion){
    const reveal = () => heroVideo.classList.add("visible");
    const keepPoster = () => heroVideo.classList.remove("visible");
    heroVideo.addEventListener("playing", reveal);
    heroVideo.addEventListener("error", keepPoster);
    const p = heroVideo.play();
    if(p !== undefined) p.catch(keepPoster);
  }

  // ---- Optional reel on the Work page ----
  const reelWrapper = document.getElementById("reelWrapper");
  if(CONTENT.reel.video){
    reelWrapper.innerHTML = `<video autoplay muted loop playsinline poster="${CONTENT.reel.poster}">
      <source src="${CONTENT.reel.video}" type="video/mp4"></video>`;
  } else {
    reelWrapper.remove();
  }

  // ---- Work grid ----
  const grid = document.getElementById("projectGrid");
  CONTENT.projects.forEach(proj => {
    const item = document.createElement("div");
    item.className = "grid-item";
    const playBadge = proj.video ? `<div class="play-badge"><span></span></div>` : "";
    item.innerHTML = `
      <div class="thumb">
        <img src="${proj.thumbnail}" alt="Still from ${esc(proj.title)}" loading="lazy">
        ${playBadge}
      </div>
      <div class="caption">
        <div class="project-title">${esc(proj.title)}</div>
        <div class="project-sub">${esc(proj.subtitle)}</div>
      </div>`;
    item.addEventListener("click", () => openLightbox(proj.title, proj.subtitle, proj.thumbnail, proj.video));
    grid.appendChild(item);
  });

  // ---- Stills grid ----
  const stillsGrid = document.getElementById("stillsGrid");
  CONTENT.stills.forEach(st => {
    const item = document.createElement("div");
    item.className = "still-item";
    item.innerHTML = `<div class="thumb"><img src="${st.thumbnail}" alt="${esc(st.title)}" loading="lazy"></div>`;
    item.addEventListener("click", () => openLightbox(st.title, st.subtitle, st.thumbnail));
    stillsGrid.appendChild(item);
  });

  // ---- Lightbox ----
  const lightbox = document.getElementById("lightbox");
  const lbMedia = document.getElementById("lbMedia");

  function openLightbox(title, sub, img, video){
    const embedUrl = video ? getEmbedUrl(video) : null;

    if(video && embedUrl){
      // Click-to-play would be nicer for performance, but since this only
      // loads when the visitor actively opens a project, autoplaying the
      // embed here keeps things simple and still feels instant.
      lbMedia.innerHTML = `<iframe src="${embedUrl}" title="${esc(title)}" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" allowfullscreen loading="lazy"></iframe>`;
    } else if(video && !embedUrl){
      lbMedia.innerHTML = `<div style="padding:3rem 1.5rem;color:#c9c9c4;font-size:.9rem;">This film is available at <a href="${video}" target="_blank" rel="noopener noreferrer" style="color:#fff;text-decoration:underline;">this link</a>.</div>`;
    } else {
      lbMedia.innerHTML = `<img src="${img}" alt="${esc(title)}">`;
    }

    document.getElementById("lbTitle").textContent = title;
    document.getElementById("lbSub").textContent = sub || "";
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox(){
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
    lbMedia.innerHTML = ""; // stops any playing video/iframe immediately
  }
  document.getElementById("closeLightbox").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", (e) => { if(e.key === "Escape" && lightbox.classList.contains("active")) closeLightbox(); });

  // ---- Page navigation ----
  const navLinks = document.querySelectorAll(".nav-links a[data-page], .hero-links a[data-page]");
  const pages = {
    home: document.getElementById("page-home"),
    work: document.getElementById("page-work"),
    stills: document.getElementById("page-stills"),
    about: document.getElementById("page-about"),
    contact: document.getElementById("page-contact")
  };
  function showPage(pageId){
    if(!pages[pageId]) return;
    Object.values(pages).forEach(p => p.classList.remove("active"));
    pages[pageId].classList.add("active");
    document.querySelectorAll(".nav-links a[data-page]").forEach(a => {
      a.classList.toggle("active", a.dataset.page === pageId);
    });
    document.getElementById("navToggle").classList.remove("open");
    document.getElementById("navLinks").classList.remove("open");
    window.scrollTo({ top: 0, behavior: "smooth" });
    history.replaceState(null, "", `#${pageId}`);
  }
  navLinks.forEach(link => link.addEventListener("click", (e) => {
    e.preventDefault();
    showPage(link.dataset.page);
  }));
  document.getElementById("logoBtn").addEventListener("click", () => showPage("home"));
  document.getElementById("skipLink").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("main").setAttribute("tabindex", "-1");
    document.getElementById("main").focus();
  });

  const initial = location.hash.replace("#", "");
  if(pages[initial]) showPage(initial);

  // ---- Theme toggle ----
  const themeToggle = document.getElementById("themeToggleNav");
  let dark = localStorage.getItem("theme") === "dark";
  if(dark){ document.documentElement.setAttribute("data-theme", "dark"); themeToggle.textContent = "◑"; }
  themeToggle.addEventListener("click", () => {
    dark = !dark;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    localStorage.setItem("theme", dark ? "dark" : "light");
    themeToggle.textContent = dark ? "◑" : "⊙";
  });

  // ---- Mobile nav ----
  const navToggle = document.getElementById("navToggle");
  navToggle.addEventListener("click", () => {
    navToggle.classList.toggle("open");
    document.getElementById("navLinks").classList.toggle("open");
  });
})();
</script>
</body>
